name: Publish package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-26.04
    services:
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NOSKRAP_TEST_REDIS_URL: redis://127.0.0.1:6379
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Validate release target
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            assert.equal(pkg.name, "noskrap");
            assert(/^\d+\.\d+\.\d+$/.test(pkg.version));
            assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`);
          '
          git merge-base --is-ancestor HEAD origin/main
      - run: bun install --frozen-lockfile
      - run: bun install --cwd web --frozen-lockfile
      - run: bun install --cwd tests/next15 --frozen-lockfile
      - run: bun audit --audit-level=high
      - run: bun audit --audit-level=high
        working-directory: web
      - run: bun audit --audit-level=high
        working-directory: tests/next15
      - run: bun run check
        env:
          NOSKRAP_PACKAGE_OUTPUT: ${{ runner.temp }}/noskrap-package
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ runner.temp }}/noskrap-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: package
      - name: Publish verified artifact using npm OIDC
        shell: bash
        run: |
          shopt -s nullglob
          archives=(package/*.tgz)
          test "${#archives[@]}" -eq 1
          npm publish "${archives[0]}" --access public --registry=https://registry.npmjs.org
